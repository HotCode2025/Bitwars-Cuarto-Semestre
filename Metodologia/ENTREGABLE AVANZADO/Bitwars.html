<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4338ca">
<title>Bitwars — Oficios de Mendoza</title>
<style>
:root{
  --brand-50:#eef2ff;--brand-100:#e0e7ff;--brand-400:#818cf8;--brand-500:#6366f1;
  --brand-600:#4f46e5;--brand-700:#4338ca;--violet-600:#7c3aed;
  --bg:#f7f7f9;--surface:#fff;--surface-2:#f4f4f6;--surface-3:#eceef1;
  --border:#e7e7ea;--border-strong:#d8d8de;
  --text:#18181b;--text-2:#3f3f46;--text-3:#71717a;--text-4:#a1a1aa;
  --success:#059669;--success-bg:rgba(5,150,105,.10);--success-fg:#047857;
  --warn:#d97706;--warn-bg:rgba(217,119,6,.10);--warn-fg:#b45309;
  --danger:#dc2626;--danger-bg:rgba(220,38,38,.08);--danger-fg:#b91c1c;
  --info:#0284c7;--info-bg:rgba(2,132,199,.10);--info-fg:#0369a1;
  --amber:#f59e0b;
  --sh-xs:0 1px 2px rgba(24,24,27,.04);
  --sh-sm:0 1px 2px rgba(24,24,27,.05),0 1px 3px rgba(24,24,27,.03);
  --sh-md:0 4px 12px rgba(24,24,27,.06),0 1px 3px rgba(24,24,27,.04);
  --sh-lg:0 12px 28px rgba(24,24,27,.08),0 4px 8px rgba(24,24,27,.04);
  --sh-brand:0 8px 20px -4px rgba(79,70,229,.28);
  --ease:cubic-bezier(.4,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#09090b;--surface:#131316;--surface-2:#1c1c21;--surface-3:#26262c;
  --border:#26262c;--border-strong:#35353d;
  --text:#fafafa;--text-2:#d4d4d8;--text-3:#a1a1aa;--text-4:#71717a;
  --brand-600:#6366f1;--brand-700:#818cf8;--brand-100:#312e81;--brand-50:rgba(99,102,241,.12);
  --success-bg:rgba(16,185,129,.14);--success-fg:#34d399;
  --warn-bg:rgba(245,158,11,.14);--warn-fg:#fbbf24;
  --danger-bg:rgba(239,68,68,.14);--danger-fg:#f87171;
  --info-bg:rgba(14,165,233,.14);--info-fg:#38bdf8;
  --sh-xs:0 1px 2px rgba(0,0,0,.4);
  --sh-sm:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.3);
  --sh-md:0 4px 12px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --sh-lg:0 12px 28px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.3);
  --sh-brand:0 8px 20px -4px rgba(99,102,241,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:radial-gradient(1200px 800px at 20% -10%,#1e1b4b 0%,transparent 55%),radial-gradient(900px 700px at 100% 110%,#4c1d95 0%,transparent 55%),#09090b;color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;color:inherit;font-weight:600}
img,svg{display:block;max-width:100%}
svg{flex-shrink:0}
#app{width:100%;max-width:430px;height:100dvh;max-height:900px;background:var(--bg);display:flex;flex-direction:column;border-radius:0;overflow:hidden;position:relative;box-shadow:0 40px 100px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04)}
@media (min-width:520px){#app{border-radius:36px}}
@media (max-width:519px){body{background:var(--bg);align-items:stretch}#app{max-width:100%;max-height:100dvh;border-radius:0;box-shadow:none}}
.h1{font-size:28px;font-weight:800;letter-spacing:-.9px;line-height:1.15;color:var(--text)}
.h2{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.2}
.h3{font-size:16px;font-weight:800;letter-spacing:-.35px;color:var(--text)}
#topbar{display:none;align-items:center;gap:10px;padding:14px 16px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border-bottom:1px solid var(--border);min-height:60px;flex-shrink:0;z-index:20}
#topbar.visible{display:flex}
.tb-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);background:transparent;transition:all .18s var(--ease);flex-shrink:0}
.tb-btn:hover{background:var(--surface-2)}
.tb-btn:active{transform:scale(.94)}
.tb-btn.avatar-btn{background:linear-gradient(135deg,var(--brand-600),var(--violet-600));color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.2px;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.tb-title{flex:1;font-weight:700;font-size:15.5px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.tb-user{display:flex;align-items:center;gap:6px}
#screen{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.screen-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:20px;position:relative;overscroll-behavior:contain}
.screen-scroll::-webkit-scrollbar{width:0;height:0}
#bottomnav{display:none;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;z-index:20;gap:2px}
#bottomnav.visible{display:flex}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:10.5px;color:var(--text-4);font-weight:600;border-radius:12px;transition:all .2s var(--ease);letter-spacing:.1px;position:relative}
.nav-item .ni-icon{position:relative;transition:transform .25s var(--ease-spring)}
.nav-item.active{color:var(--brand-700)}
.nav-item.active .ni-icon{transform:translateY(-1px) scale(1.05)}
.nav-item:active{background:var(--surface-2)}
.nav-item.active::before{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--brand-600),var(--violet-600))}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(800px 600px at 30% 20%,rgba(124,58,237,.55) 0%,transparent 55%),radial-gradient(900px 700px at 80% 90%,rgba(99,102,241,.5) 0%,transparent 60%),linear-gradient(160deg,#312e81 0%,#1e1b4b 60%,#0f172a 100%);color:#fff;gap:22px;position:relative;overflow:hidden}
.splash::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1px,transparent 0);background-size:22px 22px;mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 70%);pointer-events:none}
.splash-logo{width:104px;height:104px;border-radius:28px;background:linear-gradient(145deg,#fff 0%,#e0e7ff 100%);display:grid;place-items:center;position:relative;z-index:1;box-shadow:0 30px 60px -15px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.2),inset 0 1px 0 rgba(255,255,255,.9);animation:logoIn .8s var(--ease-out) both}
.splash-logo svg{width:56px;height:56px;color:var(--brand-700)}
@keyframes logoIn{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.splash h1{font-size:36px;font-weight:800;letter-spacing:-1.5px;z-index:1}
.splash .tagline{opacity:.7;font-size:13.5px;letter-spacing:.3px;z-index:1;font-weight:500}
.splash-loader{margin-top:28px;width:32px;height:32px;z-index:1;border:2.5px solid rgba(255,255,255,.18);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth{padding:36px 24px 28px;display:flex;flex-direction:column;min-height:100%}
.auth-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,var(--brand-600),var(--violet-600));display:grid;place-items:center;margin-bottom:22px;box-shadow:var(--sh-brand);color:#fff}
.auth-logo svg{width:30px;height:30px}
.auth h2{margin-bottom:6px}
.auth .sub{color:var(--text-3);font-size:14px;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:7px;letter-spacing:.2px}
.field .input-wrap{position:relative;display:flex;align-items:center}
.field .input-icon{position:absolute;left:14px;color:var(--text-4);pointer-events:none;transition:color .18s var(--ease)}
.field input,.field textarea,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);outline:none;transition:all .18s var(--ease);font-size:14.5px;color:var(--text);font-weight:500}
.field .has-icon input{padding-left:42px}
.field input::placeholder,.field textarea::placeholder{color:var(--text-4);font-weight:400}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand-500);box-shadow:0 0 0 4px rgba(99,102,241,.10)}
.field .input-wrap:focus-within .input-icon{color:var(--brand-600)}
.field textarea{resize:vertical;min-height:96px;line-height:1.5;font-weight:400}
.field select{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:42px}
.btn{width:100%;padding:13px 18px;border-radius:12px;font-weight:600;font-size:14.5px;letter-spacing:.1px;transition:all .18s var(--ease);display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;user-select:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.985)}
.btn-primary{background:linear-gradient(180deg,var(--brand-600),var(--brand-700));color:#fff;box-shadow:var(--sh-brand),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-primary:not(:disabled):hover{background:linear-gradient(180deg,var(--brand-500),var(--brand-600))}
.btn-outline{background:var(--surface);border:1.5px solid var(--border-strong);color:var(--text)}
.btn-outline:not(:disabled):hover{background:var(--surface-2)}
.btn-secondary{background:var(--surface-2);color:var(--text)}
.btn-secondary:not(:disabled):hover{background:var(--surface-3)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg);border:1.5px solid transparent}
.btn-danger:not(:disabled):hover{background:rgba(220,38,38,.14);border-color:rgba(220,38,38,.2)}
.btn-success{background:linear-gradient(180deg,#059669,#047857);color:#fff;box-shadow:0 6px 16px -4px rgba(5,150,105,.35)}
.btn-sm{padding:8px 14px;font-size:12.5px;width:auto;border-radius:9px;gap:6px}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.role-opt{padding:18px 12px 16px;border:1.5px solid var(--border);border-radius:16px;text-align:center;background:var(--surface);transition:all .18s var(--ease);cursor:pointer;position:relative;overflow:hidden}
.role-opt:hover{border-color:var(--border-strong)}
.role-opt .ro-icon{width:44px;height:44px;margin:0 auto 10px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);transition:all .2s var(--ease)}
.role-opt .ro-label{font-weight:700;font-size:13.5px;color:var(--text);letter-spacing:-.1px}
.role-opt .ro-desc{font-size:11px;color:var(--text-3);margin-top:3px;font-weight:500}
.role-opt.selected{border-color:var(--brand-500);background:var(--brand-50);box-shadow:0 0 0 4px rgba(99,102,241,.08)}
.role-opt.selected .ro-icon{background:linear-gradient(145deg,var(--brand-600),var(--violet-600));color:#fff;box-shadow:0 4px 12px -2px rgba(79,70,229,.4)}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--text-4);font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.demo-creds{background:var(--surface-2);border-radius:16px;padding:14px;margin-top:16px;border:1px solid var(--border)}
.demo-creds .dc-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.demo-creds .dc-row{display:flex;gap:8px}
.demo-creds .dc-btn{flex:1;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:11.5px;font-weight:600;text-align:left;line-height:1.35;transition:all .15s var(--ease);color:var(--text-2)}
.demo-creds .dc-btn:hover{border-color:var(--brand-400);color:var(--brand-700)}
.demo-creds .dc-btn b{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:1px}
.demo-creds .dc-hint{font-size:11px;color:var(--text-4);margin-top:8px;text-align:center}
.demo-creds .dc-hint b{color:var(--text-3)}
.link{color:var(--brand-700);font-weight:600;text-decoration:none;cursor:pointer;transition:color .15s;display:inline-flex;align-items:center;gap:2px}
.link:hover{color:var(--brand-600);text-decoration:underline;text-underline-offset:2px}
.hero{padding:28px 22px 32px;background:radial-gradient(500px 300px at 90% -10%,rgba(139,92,246,.55) 0%,transparent 60%),linear-gradient(160deg,#4f46e5 0%,#4338ca 50%,#6d28d9 100%);color:#fff;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.10) 1px,transparent 0);background-size:20px 20px;mask-image:radial-gradient(circle at 70% 30%,#000 0%,transparent 65%);-webkit-mask-image:radial-gradient(circle at 70% 30%,#000 0%,transparent 65%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero-greet{font-size:13px;opacity:.75;letter-spacing:.2px;font-weight:500}
.hero-name{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:3px 0 6px}
.hero-sub{font-size:13.5px;opacity:.82;margin-bottom:18px;font-weight:500}
.hero-search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:13px 16px;color:#fff;cursor:pointer;transition:all .2s var(--ease)}
.hero-search:hover{background:rgba(255,255,255,.2)}
.hero-search input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14.5px;cursor:pointer;font-weight:500}
.hero-search input::placeholder{color:rgba(255,255,255,.75)}
.hero-tags{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hero-tag{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);font-size:11.5px;font-weight:600;letter-spacing:.1px;display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.section{padding:22px 20px 6px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.section-head h3{font-size:16px;font-weight:800;letter-spacing:-.35px;color:var(--text)}
.section-head .link{font-size:12.5px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;background:var(--surface);border:1px solid var(--border);border-radius:16px;transition:all .18s var(--ease);cursor:pointer}
.cat-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--sh-md)}
.cat-card:active{transform:scale(.96)}
.cat-card .cc-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand-50),color-mix(in srgb,var(--brand-100) 60%,transparent));color:var(--brand-700);font-size:20px;line-height:1}
.cat-card .cc-label{font-size:10.5px;font-weight:600;text-align:center;color:var(--text-2);line-height:1.25;letter-spacing:.1px}
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}
.h-scroll .pro-card{scroll-snap-align:start;flex-shrink:0;width:216px}
.pro-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:11px;transition:all .2s var(--ease);cursor:pointer;box-shadow:var(--sh-xs)}
.pro-card:hover{border-color:var(--border-strong);box-shadow:var(--sh-md);transform:translateY(-2px)}
.pro-card:active{transform:scale(.985)}
.pro-card .pc-top{display:flex;gap:11px;align-items:center}
.avatar{border-radius:14px;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0;width:48px;height:48px;font-size:16px;letter-spacing:-.3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 6px rgba(0,0,0,.08);position:relative;overflow:hidden}
.avatar::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 55%)}
.avatar.lg{width:76px;height:76px;border-radius:22px;font-size:26px}
.avatar.sm{width:36px;height:36px;border-radius:11px;font-size:13px}
.pro-card .pc-info{flex:1;min-width:0}
.pro-card .pc-name{font-weight:700;font-size:14px;letter-spacing:-.2px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.pro-card .pc-cat{font-size:12.5px;color:var(--text-3);margin-top:1px;font-weight:500}
.pro-card .pc-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
.pro-card .pc-rating{display:flex;align-items:center;gap:3px;color:var(--amber);font-weight:700}
.pro-card .pc-rating span{color:var(--text-3);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.tag-verified{background:var(--success-bg);color:var(--success-fg)}
.tag-available{background:var(--brand-50);color:var(--brand-700)}
.tag-busy{background:var(--surface-2);color:var(--text-3)}
.tag-warn{background:var(--warn-bg);color:var(--warn-fg)}
[data-theme="dark"] .tag-available{background:rgba(99,102,241,.16);color:#a5b4fc}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.1px;white-space:nowrap}
.badge svg{width:12px;height:12px}
.badge-PENDIENTE{background:var(--warn-bg);color:var(--warn-fg)}
.badge-CONTACTADO{background:var(--info-bg);color:var(--info-fg)}
.badge-EN_PROCESO{background:var(--brand-50);color:var(--brand-700)}
[data-theme="dark"] .badge-EN_PROCESO{background:rgba(99,102,241,.16);color:#a5b4fc}
.badge-COMPLETADO{background:var(--success-bg);color:var(--success-fg)}
.badge-CANCELADO{background:var(--surface-2);color:var(--text-3)}
.badge-RECHAZADO{background:var(--danger-bg);color:var(--danger-fg)}
.searchbar-wrap{padding:14px 18px 10px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--surface-2);border-radius:12px;padding:11px 14px;border:1.5px solid transparent;transition:all .18s var(--ease);color:var(--text-3)}
.searchbar:focus-within{border-color:var(--brand-500);background:var(--surface);box-shadow:0 0 0 4px rgba(99,102,241,.08)}
.searchbar input{flex:1;background:none;border:none;outline:none;font-size:14.5px;color:var(--text);font-weight:500}
.searchbar input::placeholder{color:var(--text-4);font-weight:400}
.searchbar .clear-btn{color:var(--text-3);padding:2px;border-radius:6px;display:grid;place-items:center}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface-2);border:1px solid transparent;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--text-2);transition:all .15s var(--ease);display:inline-flex;align-items:center;gap:5px}
.chip:hover{background:var(--surface-3)}
.chip.active{background:linear-gradient(180deg,var(--brand-600),var(--brand-700));color:#fff;box-shadow:0 2px 8px -2px rgba(79,70,229,.4)}
.chip:active{transform:scale(.95)}
.results{padding:14px 18px 24px;display:flex;flex-direction:column;gap:10px}
.results-count{font-size:12px;color:var(--text-3);font-weight:600;padding:2px 2px 4px}
.empty{text-align:center;padding:56px 30px;color:var(--text-3);display:flex;flex-direction:column;align-items:center}
.empty .em-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-4);margin-bottom:16px}
.empty .em-icon svg{width:30px;height:30px}
.empty h4{font-size:15px;font-weight:700;color:var(--text);margin-bottom:5px;letter-spacing:-.2px}
.empty p{font-size:13px;line-height:1.55;max-width:260px;color:var(--text-3)}
.empty .btn{margin-top:18px;width:auto;padding:11px 22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--sh-xs)}
.stack{padding:16px;display:flex;flex-direction:column;gap:12px}
.stack-sm{padding:12px 18px;display:flex;flex-direction:column;gap:9px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;align-items:center}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-3);display:flex;align-items:center;gap:7px;font-weight:500}
.kv .v{font-weight:600;text-align:right;color:var(--text);display:flex;align-items:center;gap:6px;justify-content:flex-end}
.review{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--border)}
.review:last-child{border-bottom:none;padding-bottom:0}
.review:first-child{padding-top:0}
.review .rv-body{flex:1;min-width:0}
.review .rv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.review .rv-name{font-weight:700;font-size:13.5px;color:var(--text)}
.review .rv-stars{display:flex;gap:1px;color:var(--amber)}
.review .rv-stars svg{width:13px;height:13px}
.review .rv-stars .off{color:var(--border-strong)}
.review .rv-text{font-size:13px;color:var(--text-3);line-height:1.55;font-weight:400}
.review .rv-date{font-size:11px;color:var(--text-4);margin-top:6px;font-weight:500}
.star-picker{display:flex;gap:10px;justify-content:center;margin:6px 0 20px}
.star-picker .sp-star{color:var(--border-strong);transition:all .15s var(--ease-spring);cursor:pointer;line-height:0}
.star-picker .sp-star svg{width:38px;height:38px}
.star-picker .sp-star.on{color:var(--amber);transform:scale(1.06)}
.star-picker .sp-star:hover{transform:scale(1.12)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 14px;box-shadow:var(--sh-xs);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brand-600),var(--violet-600));opacity:.9}
.stat.warn::before{background:var(--warn)}
.stat.ok::before{background:var(--success)}
.stat .st-val{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--text);line-height:1}
.stat .st-lbl{font-size:11px;color:var(--text-3);font-weight:600;margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
.stat.warn .st-val{color:var(--warn-fg)}
.stat.ok .st-val{color:var(--success-fg)}
.actions{display:flex;gap:9px;padding:14px 18px}
.actions .btn{flex:1}
#toast-wrap{position:absolute;bottom:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:100;padding:0 20px}
.toast{background:rgba(24,24,27,.96);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-lg);animation:toastIn .3s var(--ease-out);max-width:100%;text-align:center;line-height:1.4;display:flex;align-items:center;gap:9px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
.toast svg{flex-shrink:0}
.toast.success{background:rgba(5,150,105,.96)}
.toast.error{background:rgba(220,38,38,.96)}
.toast.info{background:rgba(79,70,229,.96)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:height .22s var(--ease);color:var(--text-3);font-size:12.5px;font-weight:600;gap:9px}
.ptr.active{height:46px}
.ptr .spin{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--brand-600);border-radius:50%;animation:spin .7s linear infinite}
.tabs{display:flex;gap:6px;padding:14px 18px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--text-3);transition:all .15s var(--ease);display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--surface-3)}
.tab.active{background:linear-gradient(180deg,var(--brand-600),var(--brand-700));color:#fff;box-shadow:0 2px 8px -2px rgba(79,70,229,.4)}
.tab .tab-count{font-size:10.5px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.2);font-weight:700}
.tab:not(.active) .tab-count{background:var(--surface-3);color:var(--text-3)}
.timeline{position:relative;padding-left:4px}
.tl-item{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:8px;top:24px;bottom:-8px;width:2px;background:var(--border);border-radius:2px}
.tl-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;background:var(--surface-2);border:2px solid var(--border-strong);display:grid;place-items:center;z-index:1;margin-top:2px;color:var(--text-4)}
.tl-dot svg{width:10px;height:10px}
.tl-dot.active{background:linear-gradient(145deg,var(--brand-600),var(--violet-600));border-color:var(--brand-600);color:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.tl-body{flex:1;min-width:0}
.tl-title{font-weight:600;font-size:13.5px;color:var(--text)}
.tl-date{font-size:11.5px;color:var(--text-4);margin-top:2px;font-weight:500}
</style>
</head>

function formatFecha(iso){
  const d = new Date(iso);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}, ${hh}:${mm}`;
}
function formatFechaCorta(iso){ const d=new Date(iso); return `${d.getDate()} ${MESES[d.getMonth()]}`; }
function initials(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function avatarColor(str){
  const p = ['#4f46e5','#0284c7','#059669','#d97706','#dc2626','#7c3aed','#db2777','#0d9488','#ea580c','#4338ca'];
  let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0;
  return p[h%p.length];
}
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+p));
  const g=Math.max(0,Math.min(255,((n>>8)&255)+p));
  const b=Math.max(0,Math.min(255,(n&255)+p));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function avatarHTML(nombre,size=''){
  const c = avatarColor(nombre);
  return `<div class="avatar ${size}" style="background:linear-gradient(145deg,${c},${shade(c,-22)})">${initials(nombre)}</div>`;
}
function escapeHTML(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg,type='info'){

  el.innerHTML = ic(icn,16,2.2)+'<span>'+escapeHTML(msg)+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{el.style.transition='.28s cubic-bezier(.4,0,.2,1)';el.style.opacity='0';el.style.transform='translateY(10px) scale(.96)';},2400);
  setTimeout(()=>el.remove(),2750);
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
const LS_DB='bitwars_db_v1', LS_SESSION='bitwars_session_v1', LS_THEME='bitwars_theme_v1';
let DB = {usuarios:[],profesionales:[],solicitudes:[],reviews:[],categorias:[],ciudades:[],municipios:[]};
let session = {user:null};

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_DB);
    if (raw) DB = JSON.parse(raw);
    if (!DB.usuarios || !DB.usuarios.length){ DB = seedDB(); saveDB(); }
    if (!DB.categorias?.length) DB.categorias = SEED_CATEGORIAS;
    if (!DB.ciudades?.length) DB.ciudades = SEED_CIUDADES;
    if (!DB.municipios?.length) DB.municipios = SEED_MUNICIPIOS;
  }catch(e){ DB = seedDB(); saveDB(); }
}
function saveDB(){ localStorage.setItem(LS_DB, JSON.stringify(DB)); }
function resetDB(){ localStorage.removeItem(LS_DB); DB = seedDB(); saveDB(); }
function loadSession(){ try{ const r=localStorage.getItem(LS_SESSION); if(r) session=JSON.parse(r); }catch(e){} }
function saveSession(){ localStorage.setItem(LS_SESSION, JSON.stringify(session)); }
function clearSession(){ localStorage.removeItem(LS_SESSION); session={user:null}; }

/* ============================================================
   DATA ACCESS
   ============================================================ */
const getCategoria = id => DB.categorias.find(c=>c.id===id);
const getCiudad = id => DB.ciudades.find(c=>c.id===id);
const getUsuario = id => DB.usuarios.find(u=>u.id===id);
const getProfesionalByUsuario = id => DB.profesionales.find(p=>p.usuarioId===id);
const getProfesional = id => DB.profesionales.find(p=>p.id===id);
const getSolicitud = id => DB.solicitudes.find(s=>s.id===id);
function getReviewsProfesional(id){ return DB.reviews.filter(r=>r.profesionalId===id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); }
function solicitudTieneReview(id){ return DB.reviews.some(r=>r.solicitudId===id); }
function recalcularRating(proId){
  const pro = getProfesional(proId); if (!pro) return;
  const rs = DB.reviews.filter(r=>r.profesionalId===proId);
  pro.totalReviews = rs.length;
  pro.rating = rs.length ? +(rs.reduce((a,r)=>a+r.rating,0)/rs.length).toFixed(1) : 0;
  saveDB();
}

/* ============================================================
   AUTH
   ============================================================ */
function login(telefono,password){
  const u = DB.usuarios.find(x=>x.telefono===telefono.trim());
  if (!u) throw new Error('No existe una cuenta con ese teléfono.');
  if (u.password !== password) throw new Error('Contraseña incorrecta.');
  session.user = {id:u.id,nombre:u.nombre,telefono:u.telefono,rol:u.rol,email:u.email};
  saveSession();
  return session.user;
}
function register({nombre,telefono,email,password,rol}){
  if (!nombre||!telefono||!password) throw new Error('Completá todos los campos obligatorios.');
  if (password.length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres.');
  if (DB.usuarios.some(u=>u.telefono===telefono.trim())) throw new Error('Ya existe una cuenta con ese teléfono.');
  const user = {id:'usr-'+uid(),nombre:nombre.trim(),telefono:telefono.trim(),password,rol,email:email||'',fechaRegistro:new Date().toISOString()};
  DB.usuarios.push(user); saveDB();
  session.user = {id:user.id,nombre:user.nombre,telefono:user.telefono,rol:user.rol,email:user.email};
  saveSession();
  return session.user;
}
function logout(){ clearSession(); routeStack=[]; navigate('login',{},true); }

/* ============================================================
   ROUTER
   ============================================================ */
let currentRoute = {name:'splash',params:{}};
let routeStack = [];
const routes = {};
const postRender = {};

function navigate(name,params={},replace=false){
  if (!replace && currentRoute && currentRoute.name !== name) routeStack.push(currentRoute);
  currentRoute = {name,params};
  render();
  requestAnimationFrame(()=>{ const s=$('.screen-scroll'); if(s) s.scrollTop=0; });
}
function back(){
  const prev = routeStack.pop();
  if (prev){ currentRoute=prev; render(); requestAnimationFrame(()=>{ const s=$('.screen-scroll'); if(s) s.scrollTop=0; }); }
  else navigate('home',{},true);
}

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(){
  const t = localStorage.getItem(LS_THEME)||'light';
  document.documentElement.setAttribute('data-theme',t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t==='dark'?'#09090b':'#4338ca');
}
function toggleTheme(){
  const cur = localStorage.getItem(LS_THEME)||'light';
  localStorage.setItem(LS_THEME, cur==='light'?'dark':'light');
  applyTheme(); render();
}

/* ============================================================
   TOPBAR / BOTTOMNAV
   ============================================================ */
function renderTopbar(){
  const tb = $('#topbar');
  const titles = {
    'buscar':'Buscar profesionales','profesional':'Perfil profesional','solicitar':'Nueva solicitud',
    'feedback':'','solicitudes':'Solicitudes','solicitud-detalle':'Detalle','perfil':'Mi perfil',
    'dejar-review':'Dejar reseña','completar-perfil':'Completar perfil'
  };
  const showBack = !['home','login','register','splash','feedback'].includes(currentRoute.name);
  const isDark = (localStorage.getItem(LS_THEME)||'light')==='dark';
  const isHomePro = currentRoute.name==='home' && session.user?.rol==='PROFESIONAL';

  if (['splash','login','register'].includes(currentRoute.name)){ tb.classList.remove('visible'); return; }
  if (currentRoute.name==='home' && session.user?.rol==='CLIENTE'){ tb.classList.remove('visible'); return; }
  tb.classList.add('visible');

  const user = session.user;
  const title = titles[currentRoute.name] ?? (isHomePro?'Bitwars':'');
  tb.innerHTML = `
    ${showBack?`<button class="tb-btn" onclick="back()" aria-label="Volver">${ic('arrowLeft',20)}</button>`:''}
    <div class="tb-title">${escapeHTML(title)}</div>
    <div class="tb-user">
      <button class="tb-btn" onclick="toggleTheme()" aria-label="Cambiar tema">${ic(isDark?'sun':'moon',19)}</button>
      ${user?`<button class="tb-btn avatar-btn" onclick="confirmLogout()" title="Cerrar sesión">${initials(user.nombre)}</button>`:''}
    </div>
  `;
}
function confirmLogout(){ if (confirm('¿Cerrar sesión?')) logout(); }

function renderBottomNav(){
  const nav = $('#bottomnav');
  const u = session.user;
  if (!u || ['splash','login','register','completar-perfil','feedback'].includes(currentRoute.name)){
    nav.classList.remove('visible'); return;
  }
  nav.classList.add('visible');
  const items = u.rol==='CLIENTE' ? [
    {name:'home',icon:'home',label:'Inicio'},
    {name:'buscar',icon:'search',label:'Buscar'},
    {name:'solicitudes',icon:'clipboard',label:'Solicitudes'},
    {name:'perfil',icon:'user',label:'Perfil'}
  ] : [
    {name:'home',icon:'home',label:'Inicio'},
    {name:'solicitudes',icon:'clipboard',label:'Solicitudes'},
    {name:'perfil',icon:'user',label:'Perfil'}
  ];
  nav.innerHTML = items.map(it=>{
    const active = currentRoute.name===it.name ||
      (it.name==='buscar' && currentRoute.name==='profesional') ||
      (it.name==='solicitudes' && currentRoute.name==='solicitud-detalle');
    return `<button class="nav-item ${active?'active':''}" onclick="navigate('${it.name}')">
      <span class="ni-icon">${ic(it.icon,21,active?2.2:1.9)}</span>
      <span>${it.label}</span>
    </button>`;
  }).join('');
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  renderTopbar();
  renderBottomNav();
  const screen = $('#screen');
  const fn = routes[currentRoute.name];
  if (!fn){ screen.innerHTML = `<div class="empty">${ic('alertCircle',32)}<h4>Pantalla no encontrada</h4></div>`; return; }
  screen.innerHTML = fn(currentRoute.params);
  if (postRender[currentRoute.name]) postRender[currentRoute.name]();
}

postRender.buscar = () => {
  renderResultados();
  const inp = $('#searchInput');
  inp.addEventListener('input', e => {
    clearTimeout(searchTimer);
    const val = e.target.value;
    searchTimer = setTimeout(()=>{
      filtros.q = val;
      const bar = document.querySelector('.searchbar');
      let clearBtn = bar.querySelector('.clear-btn');

};
window.clearSearch = () => {
  filtros.q = '';
  const inp = $('#searchInput'); if (inp) inp.value = '';
  const bar = document.querySelector('.searchbar');
  const btn = bar?.querySelector('.clear-btn'); if (btn) btn.remove();

window.setFiltro = (k,v) => { filtros[k] = (filtros[k]===v?'':v); render(); };

function renderResultados(){
  const cont = $('#resultados'); if (!cont) return;
  const q = filtros.q.trim().toLowerCase();
  let list = DB.profesionales.slice();
  if (filtros.categoriaId) list = list.filter(p=>p.categoriaId===filtros.categoriaId);
  if (filtros.ciudadId) list = list.filter(p=>p.ciudadId===filtros.ciudadId);
  if (filtros.soloDisponibles) list = list.filter(p=>p.disponible);
  if (filtros.soloVerificados) list = list.filter(p=>p.verificado);
  if (q){
    list = list.filter(p=>{
      const cat = getCategoria(p.categoriaId)?.nombre?.toLowerCase()||'';
      return p.nombre.toLowerCase().includes(q) || cat.includes(q) || (p.descripcion||'').toLowerCase().includes(q);
    });
  }
  list.sort((a,b)=>b.rating-a.rating);
  if (!list.length){
    cont.innerHTML = `<div class="empty">
      <div class="em-icon">${ic('search',30)}</div>
      <h4>Sin resultados</h4>
      <p>Probá cambiar los filtros o la búsqueda.</p>
    </div>`;
    return;
  }
  cont.innerHTML = `<div class="results-count">${list.length} profesional${list.length!==1?'es':''} encontrado${list.length!==1?'s':''}</div>`
    + list.map(proCardHTML).join('');
}

    if (s.estado==='EN_PROCESO'){
      acciones.push({label:'Marcar completado', icon:'checkCircle', cls:'btn-success', fn:`cambiarEstado('${s.id}','COMPLETADO')`});
      acciones.push({label:'Volver a contactado', icon:'arrowLeft', cls:'btn-outline', fn:`cambiarEstado('${s.id}','CONTACTADO')`});

  }
  if (esDueñoCli){

    <div class="screen-scroll">
      <div class="stack">
        <div class="card">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
            <span class="badge badge-${s.estado}" style="font-size:12px;padding:6px 12px">${ic(est.icon,13,2.2)} ${est.label}</span>
            <span style="font-size:11.5px;color:var(--text-4);margin-left:auto">#${s.id.slice(-6).toUpperCase()}</span>
          </div>
          <div class="kv"><span class="k">${ic('briefcase',14)} Categoría</span><span class="v">${cat?escapeHTML(cat.nombre):'—'}</span></div>
          <div class="kv"><span class="k">${ic('user',14)} Cliente</span><span class="v">${escapeHTML(cli?.nombre||'—')}</span></div>
          <div class="kv"><span class="k">${ic('wrench',14)} Profesional</span><span class="v">${escapeHTML(pro?.nombre||'—')}</span></div>
          <div class="kv"><span class="k">${ic('mapPin',14)} Dirección</span><span class="v" style="max-width:60%">${escapeHTML(s.direccion)}</span></div>
          <div class="kv"><span class="k">${ic('calendar',14)} Creada</span><span class="v">${formatFecha(s.createdAt)}</span></div>
        </div>

        <div class="card">
          <div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">Descripción</div>
          <div style="font-size:14px;line-height:1.6">${escapeHTML(s.descripcion)}</div>
        </div>

        <div class="card">
          <div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px">Historial</div>
          <div class="timeline">
            ${s.historial.map((h,i)=>{
              const es = ESTADOS[h.estado]||{label:h.estado,icon:'alertCircle'};
              const esUltimo = i===s.historial.length-1;
              return `<div class="tl-item">
                <div class="tl-dot ${esUltimo?'active':''}">${esUltimo?ic(es.icon,10,2.8):''}</div>
                <div class="tl-body">
                  <div class="tl-title">${es.label}</div>
                  <div class="tl-date">${formatFecha(h.fecha)}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>

        ${rev?`<div class="card">
          <div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px">Tu reseña</div>
          ${reviewHTML(rev)}
        </div>`:''}

        ${acciones.length?`
          <div style="display:flex;flex-direction:column;gap:9px;padding-top:4px">
            ${acciones.map(a=>`<button class="btn ${a.cls}" onclick="${a.fn}">${ic(a.icon,16,2.2)} ${a.label}</button>`).join('')}
          </div>
        `:''}
      </div>
    </div>
  `;
};
window.cambiarEstado = (solId,nuevoEstado) => {
  const s = getSolicitud(solId); if (!s) return;
  if (['CANCELADO','RECHAZADO'].includes(nuevoEstado)){
    if (!confirm(`¿Confirmás ${ESTADOS[nuevoEstado].label.toLowerCase()} la solicitud?`)) return;
  }
  s.estado = nuevoEstado;
  s.historial.push({estado:nuevoEstado,fecha:new Date().toISOString()});
  s.updatedAt = new Date().toISOString();
  saveDB();
  console.log('[n8n] notif cambio estado →',nuevoEstado);
  toast(`Estado: ${ESTADOS[nuevoEstado].label}`,'success');
  render();
};

  return `

        </div>
        <div class="card" style="padding:20px">
          <div class="star-picker" id="starPicker">
            ${[1,2,3,4,5].map(n=>`<span class="sp-star ${n<=reviewStars?'on':''}" data-n="${n}" onclick="setStars(${n})">${starFilled(38)}</span>`).join('')}
          </div>
          <div class="field" style="margin-bottom:0">
            <label>Comentario</label>
            <textarea id="rev-text" placeholder="Contá cómo trabajó, si fue puntual, prolijo, etc." style="min-height:110px"></textarea>
          </div>
        </div>
        <button class="btn btn-primary" onclick="doReview('${solicitudId}')">${ic('send',16,2.1)} Publicar reseña</button>
      </div>
    </div>

};
window.setStars = n => {
  reviewStars = n;
  document.querySelectorAll('#starPicker .sp-star').forEach(el=>{
    el.classList.toggle('on', +el.dataset.n <= n);
  });
};
window.doReview = solId => {
  const s = getSolicitud(solId); if (!s) return;
  const texto = $('#rev-text').value.trim();
  if (texto.length<5){ toast('Escribí un comentario.','error'); return; }
  DB.reviews.push({
    id:'rev-'+uid(), solicitudId:solId, clienteId:s.clienteId,
    profesionalId:s.profesionalId, rating:reviewStars, comentario:texto,
    createdAt:new Date().toISOString()
  });
  saveDB();
  recalcularRating(s.profesionalId);
  toast('¡Gracias por tu reseña!','success');
  navigate('solicitud-detalle',{id:solId},true);
};

/* ============================================================
   PULL TO REFRESH
   ============================================================ */
function setupPTR(scroller,indicator,onRefresh){
  if (!scroller||!indicator) return;
  let startY=0,pulling=false,dist=0,refreshing=false;
  const threshold = 65;
  scroller.addEventListener('touchstart',e=>{
    if (scroller.scrollTop<=0 && !refreshing){ startY = e.touches[0].clientY; pulling=true; }
  },{passive:true});
  scroller.addEventListener('touchmove',e=>{
    if (!pulling||refreshing) return;
    dist = e.touches[0].clientY - startY;
    if (dist>0){ indicator.classList.add('active'); indicator.style.height = Math.min(dist,70)+'px'; }
  },{passive:true});
  scroller.addEventListener('touchend',async()=>{
    if (!pulling) return;
    pulling = false;
    if (dist>threshold && !refreshing){
      refreshing = true;
      indicator.classList.add('active');
      indicator.style.height = '46px';
      try{ await onRefresh(); } finally {
        refreshing = false;
        indicator.classList.remove('active');
        indicator.style.height = '0px';
      }
    } else {
      indicator.classList.remove('active');
      indicator.style.height = '0px';
    }
    dist = 0;
  });
}
